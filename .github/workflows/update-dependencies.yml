name: Update Dependencies

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install dotnet-outdated
        run: dotnet tool install -g dotnet-outdated-tool

      - name: Update Aspire AppHosts
        run: |
          LATEST=$(curl -s "https://api.nuget.org/v3-flatcontainer/aspire.apphost.sdk/index.json" \
            | python3 -c "import json,sys; vs=json.load(sys.stdin)['versions']; print(next(v for v in reversed(vs) if '-' not in v))")
          echo "Latest Aspire.AppHost.Sdk: $LATEST"
          grep -rl 'Aspire\.AppHost\.Sdk' --include='*.csproj' | while read -r csproj; do
            echo "Updating Aspire AppHost SDK in: $csproj"
            sed -i -E "s|Sdk=\"Aspire\.AppHost\.Sdk/[^\"]+\"|Sdk=\"Aspire.AppHost.Sdk/$LATEST\"|g" "$csproj"
          done
          # Update Aspire package versions in Directory.Packages.props to stay in sync with the SDK
          for pkg in Aspire.Hosting Aspire.Hosting.SqlServer Aspire.Hosting.Testing; do
            pkg_lower=$(echo "$pkg" | tr '[:upper:]' '[:lower:]')
            pkg_latest=$(curl -s "https://api.nuget.org/v3-flatcontainer/${pkg_lower}/index.json" \
              | python3 -c "import json,sys; vs=json.load(sys.stdin)['versions']; print(next(v for v in reversed(vs) if '-' not in v))" 2>/dev/null || echo "")
            if [ -n "$pkg_latest" ]; then
              echo "Updating $pkg to $pkg_latest in Directory.Packages.props"
              sed -i -E "s|Include=\"${pkg}\" Version=\"[^\"]+\"|Include=\"${pkg}\" Version=\"${pkg_latest}\"|g" Directory.Packages.props
            fi
          done

      - name: Update NuGet packages
        run: |
          # Run dotnet outdated on individual non-AppHost project files to avoid restore
          # failures caused by package source mapping in AppHost projects (which use the
          # Aspire.AppHost.Sdk and depend on platform-specific Aspire infrastructure packages).
          # With Central Package Management (Directory.Packages.props), updating any project
          # that references a centrally-versioned package updates the version for all projects.
          find . -name "*.csproj" \
            | grep -v '\.AppHost\.' \
            | while read -r f; do
                dotnet outdated --upgrade "$f"
              done

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B automated/update-dependencies
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update dependencies"
            git push origin automated/update-dependencies --force
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure dependencies label exists
        run: |
          gh label create dependencies --color 0E8A16 --description "Dependency updates" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view automated/update-dependencies --json number >/dev/null 2>&1 || \
          gh pr create \
            --title "chore: update dependencies" \
            --body "Automated dependency update:
          - Updated Aspire AppHost SDK versions via NuGet API
          - Updated NuGet packages via \`dotnet outdated\`" \
            --base main \
            --head automated/update-dependencies \
            --label dependencies
