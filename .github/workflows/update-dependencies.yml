name: Update Dependencies

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Update Aspire AppHost SDK references
        run: |
          LATEST=$(curl -s "https://api.nuget.org/v3-flatcontainer/aspire.apphost.sdk/index.json" \
            | python3 -c "import json,sys; vs=json.load(sys.stdin)['versions']; print(next(v for v in reversed(vs) if '-' not in v))")
          echo "Latest Aspire.AppHost.Sdk: $LATEST"
          grep -rl 'Aspire\.AppHost\.Sdk' --include='*.csproj' | while read -r csproj; do
            echo "Updating Aspire AppHost SDK in: $csproj"
            sed -i -E "s|Sdk=\"Aspire\.AppHost\.Sdk/[^\"]+\"|Sdk=\"Aspire.AppHost.Sdk/$LATEST\"|g" "$csproj"
          done

      - name: Update centrally-managed package versions
        run: |
          # Walk every PackageVersion entry in Directory.Packages.props and update it to the
          # latest stable version available on NuGet. Entries pinned to an exact/bracketed
          # version (e.g. Version="[1.2.3]") are intentionally left untouched (e.g. security
          # pins such as Microsoft.OpenApi above).
          props="Directory.Packages.props"
          python3 - "$props" <<'PY'
          import re
          import sys
          import urllib.request

          props_path = sys.argv[1]
          with open(props_path, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = re.compile(r'Include="([^"]+)"\s+Version="([^"]+)"')

          def latest_version(package_id: str) -> str | None:
              url = f"https://api.nuget.org/v3-flatcontainer/{package_id.lower()}/index.json"
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      import json
                      versions = json.load(resp)["versions"]
              except Exception as exc:
                  print(f"::warning::Could not resolve latest version for '{package_id}': {exc}")
                  return None
              stable = [v for v in versions if "-" not in v]
              return stable[-1] if stable else None

          def replace(match: re.Match) -> str:
              package_id, current_version = match.group(1), match.group(2)
              if re.fullmatch(r"\s*\[.*\]\s*", current_version):
                  print(f"Skipping {package_id}; version is pinned ({current_version})")
                  return match.group(0)

              latest = latest_version(package_id)
              if latest and latest != current_version:
                  print(f"Updating {package_id} from {current_version} to {latest} in {props_path}")
                  return f'Include="{package_id}" Version="{latest}"'
              return match.group(0)

          content = pattern.sub(replace, content)

          with open(props_path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Validate restore
        run: |
          # Updating package versions independently does not check cross-package
          # dependency constraints (e.g. Microsoft.AspNetCore.OpenApi requiring
          # Microsoft.OpenApi >= 2.12.0 && < 3.0.0). A bad bump previously merged
          # to main (see PR #18) because nothing validated restore before the
          # automated PR was created. Fail the workflow here instead of proposing a
          # PR that won't build.
          find . -name "*.csproj" -print0 | xargs -0 -n1 dotnet restore

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B automated/update-dependencies
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update dependencies"
            git push origin automated/update-dependencies --force
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure dependencies label exists
        run: |
          gh label create dependencies --color 0E8A16 --description "Dependency updates" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_BRANCH="${{ github.event.repository.default_branch }}"
          # Only treat an OPEN PR as "already exists"; a merged/closed PR should not block creating a new one.
          existing=$(gh pr list --state open --head automated/update-dependencies --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "An open PR already exists for automated/update-dependencies; skipping creation."
          else
            gh pr create \
              --title "chore: update dependencies" \
              --body "Automated dependency update:
          - Updated Aspire AppHost SDK versions via NuGet API
          - Updated centrally-managed NuGet package versions in Directory.Packages.props (pinned/bracketed versions left untouched)" \
              --base "$BASE_BRANCH" \
              --head automated/update-dependencies \
              --label dependencies
          fi
