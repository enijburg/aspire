name: Update Dependencies

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install Aspire CLI
        run: dotnet tool install -g Microsoft.DotNet.Aspire.Cli

      - name: Update Aspire AppHosts
        run: |
          grep -rl 'Aspire.AppHost.Sdk' --include='*.csproj' | while read -r csproj; do
            echo "Updating Aspire AppHost: $csproj"
            aspire update --project-path "$csproj"
          done

      - name: Update NuGet packages
        run: |
          find . -name '*.csproj' | while read -r csproj; do
            echo "Updating packages in: $csproj"
            dotnet package update --project "$csproj"
          done

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B automated/update-dependencies
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update dependencies"
            git push origin automated/update-dependencies --force
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: update dependencies" \
            --body "Automated dependency update:
          - Updated Aspire AppHost SDK versions via \`aspire update\`
          - Updated NuGet packages via \`dotnet package update\`" \
            --base main \
            --head automated/update-dependencies \
            --label dependencies \
            || true  # no-op if PR already exists
